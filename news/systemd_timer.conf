# ─────────────────────────────────────────────────────────────────
#  OPTIONNEL – Auto-fetch toutes les 30 min via systemd user timer
#
#  1. Édite les chemins ci-dessous (remplace TON_USER et le path venv)
#  2. Copie les deux fichiers dans ~/.config/systemd/user/
#  3. Active avec :
#       systemctl --user daemon-reload
#       systemctl --user enable --now btc-news.timer
#       systemctl --user status btc-news.timer
# ─────────────────────────────────────────────────────────────────

# ── Fichier 1 : ~/.config/systemd/user/btc-news.service ──────────
# [Unit]
# Description=BTC News Tracker – fetch
# 
# [Service]
# Type=oneshot
# ExecStart=/home/TON_USER/btc_news/.venv/bin/python /home/TON_USER/btc_news/btc_news.py fetch
# StandardOutput=journal
# StandardError=journal
#
# [Install]
# WantedBy=default.target


# ── Fichier 2 : ~/.config/systemd/user/btc-news.timer ───────────
# [Unit]
# Description=BTC News Tracker – toutes les 30 min
# 
# [Timer]
# OnBootSec=2min
# OnUnitActiveSec=30min
# Persistent=true
# 
# [Install]
# WantedBy=timers.target


# ── Commandes utiles ─────────────────────────────────────────────
# Voir les logs :
#   journalctl --user -u btc-news.service -f
# Lancer manuellement :
#   systemctl --user start btc-news.service
# Désactiver :
#   systemctl --user disable --now btc-news.timer
