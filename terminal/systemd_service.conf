# ─────────────────────────────────────────────────────────────────
#  OPTIONNEL – Le terminal en service utilisateur systemd
#
#  Le terminal se lance très bien à la main (`btcterm`) ; cette unité
#  couvre l'autre régime : un terminal qui tourne en continu, servi par
#  gunicorn (voir terminal/wsgi.py), toujours prêt derrière son tunnel
#  SSH — journal et alertes couvrant alors la séance entière, navigateur
#  ouvert ou non.
#
#  1. Installe gunicorn :  pip install -e '.[serve]'
#  2. Édite les chemins ci-dessous (remplace TON_USER)
#  3. Copie le bloc dans ~/.config/systemd/user/btcterm.service
#  4. Active avec :
#       systemctl --user daemon-reload
#       systemctl --user enable --now btcterm.service
#       systemctl --user status btcterm.service
#  5. (facultatif) pour qu'il survive à la déconnexion :
#       loginctl enable-linger TON_USER
# ─────────────────────────────────────────────────────────────────

# ── ~/.config/systemd/user/btcterm.service ───────────────────────
# [Unit]
# Description=BTC Terminal
# After=network-online.target
# Wants=network-online.target
#
# [Service]
# WorkingDirectory=/home/TON_USER/python/btc
# # Un seul worker, impérativement : l'état du terminal vit en mémoire
# # (terminal/wsgi.py). Les 32 threads portent les callbacks Dash et les
# # WebSockets /push — un thread par navigateur connecté.
# ExecStart=/home/TON_USER/python/btc/venv/bin/gunicorn \
#     --workers 1 --threads 32 --bind 127.0.0.1:8050 \
#     'terminal.wsgi:build()'
# # Environment=CRYPTOPANIC_API_KEY=ta_clé
# # Environment=BTCTERM_NO_NEWS=1
# # Environment=BTCTERM_NO_JOURNAL=1
# Restart=on-failure
# RestartSec=5
#
# [Install]
# WantedBy=default.target

# ── Commandes utiles ─────────────────────────────────────────────
# journalctl --user -u btcterm.service -f       # suivre les logs
# systemctl --user restart btcterm.service      # après une mise à jour
# systemctl --user disable --now btcterm.service
